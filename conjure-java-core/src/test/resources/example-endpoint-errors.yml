types:
  conjure-imports:
    importedErrors: errors-for-endpoints.yml
  definitions:
    default-package: com.palantir.product
    objects:
      OptionalBinaryResponseMode:
        values:
          - PRESENT
          - ABSENT
          - ERROR
      StringAlias:
        alias: string
      ComplicatedObject:
        fields:
          fieldOne: list<string>
          fieldTwo: optional<StringAlias>
    errors:
      InvalidArgument:
        namespace: Test
        code: INVALID_ARGUMENT
        safe-args:
          field: string
        unsafe-args:
          value: string
      NotFound:
        namespace: Test
        code: NOT_FOUND
        safe-args:
          resource: string
      ComplicatedParameters:
        namespace: Test
        code: INTERNAL
        safe-args:
          complicatedObjectMap: map<integer, ComplicatedObject>
      ConflictingCauseSafeArg:
        namespace: Conjure
        docs: Cause argument conflicts with reserved Throwable cause parameter.
        code: INTERNAL
        safe-args:
          cause: string
services:
  ErrorService:
    name: Error Service
    package: com.palantir.product
    default-auth: header
    base-path: /errors
    endpoints:
      testBasicError:
        http: POST /basic
        args:
          shouldThrowError: boolean
        returns: string
        errors:
          - InvalidArgument
          - ConflictingCauseSafeArg
      testImportedError:
        http: POST /imported
        args:
          shouldThrowError: boolean
        returns: string
        errors:
          - importedErrors.EndpointError
      testMultipleErrorsAndPackages:
        http: POST /multiple
        args:
          errorToThrow: optional<string>
        returns: string
        errors:
          - InvalidArgument
          - error: NotFound
            docs: Something was not found.
          - importedErrors.DifferentNamespace
          - importedErrors.DifferentPackage
          - ComplicatedParameters
      testEmptyBody:
        http: POST /empty
        args:
          shouldThrowError: boolean
        errors:
          - InvalidArgument
      testBinary:
        http: POST /binary
        args:
          shouldThrowError: boolean
        returns: binary
        errors:
          - InvalidArgument
      testOptionalBinary:
        http: POST /optional-binary
        args:
          mode: OptionalBinaryResponseMode
        returns: optional<binary>
        errors:
          - InvalidArgument
