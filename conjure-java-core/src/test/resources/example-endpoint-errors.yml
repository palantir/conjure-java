types:
  definitions:
    default-package: com.palantir.product
    errors:
      InvalidArgument:
        namespace: Test
        code: INVALID_ARGUMENT
        safe-args:
          field: string
        unsafe-args:
          value: string
      NotFound:
        namespace: Test
        code: NOT_FOUND
        safe-args:
          resource: string
services:
  ErrorService:
    name: Ete Service
    package: com.palantir.product
    default-auth: header
    base-path: /base
    endpoints:
      testBasicError:
        http: GET /basic
        returns: string
        errors:
          - InvalidArgument

