types:
  conjure-imports:
    importedErrors: errors-for-endpoints.yml
  definitions:
    default-package: com.palantir.product
    errors:
      InvalidArgument:
        namespace: Test
        code: INVALID_ARGUMENT
        safe-args:
          field: string
        unsafe-args:
          value: string
      NotFound:
        namespace: Test
        code: NOT_FOUND
        safe-args:
          resource: string
services:
  ErrorService:
    name: Error Service
    package: com.palantir.product
    default-auth: header
    base-path: /base
    endpoints:
      testBasicError:
        http: GET /basic
        returns: string
        errors:
          - InvalidArgument
      testImportedError:
        http: GET /imported
        returns: string
        errors:
          - importedErrors.EndpointError
      testMultipleErrorsAndPackages:
        http: GET /multiple
        returns: string
        errors:
          - InvalidArgument
          - error: NotFound
            docs: Something was not found.
          - importedErrors.DifferentNamespace
          - importedErrors.DifferentPackage