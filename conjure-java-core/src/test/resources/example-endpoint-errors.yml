types:
  conjure-imports:
    importedErrors: errors-for-endpoints.yml
  definitions:
    default-package: com.palantir.product
    objects:
      OptionalBinaryResponseMode:
        values:
          - PRESENT
          - ABSENT
          - ERROR
    errors:
      InvalidArgument:
        namespace: Test
        code: INVALID_ARGUMENT
        safe-args:
          field: string
        unsafe-args:
          value: string
      NotFound:
        namespace: Test
        code: NOT_FOUND
        safe-args:
          resource: string
services:
  ErrorService:
    name: Error Service
    package: com.palantir.product
    default-auth: header
    base-path: /errors
    endpoints:
      testBasicError:
        http: POST /basic
        args:
          shouldThrowError: boolean
        returns: string
        errors:
          - InvalidArgument
      testImportedError:
        http: POST /imported
        args:
          shouldThrowError: boolean
        returns: string
        errors:
          - importedErrors.EndpointError
      testMultipleErrorsAndPackages:
        http: POST /multiple
        args:
          errorToThrow: optional<string>
        returns: string
        errors:
          - InvalidArgument
          - error: NotFound
            docs: Something was not found.
          - importedErrors.DifferentNamespace
          - importedErrors.DifferentPackage
      testEmptyBody:
        http: POST /empty
        args:
          shouldThrowError: boolean
        errors:
          - InvalidArgument
      testBinary:
        http: POST /binary
        args:
          shouldThrowError: boolean
        returns: binary
        errors:
          - InvalidArgument
      testOptionalBinary:
        http: POST /optional-binary
        args:
          mode: OptionalBinaryResponseMode
        returns: optional<binary>
        errors:
          - InvalidArgument
