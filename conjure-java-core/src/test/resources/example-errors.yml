types:
  imports:
    Long:
      base-type: string
      external:
        java: java.lang.Long
  definitions:
    default-package: com.palantir.product
    objects:
      StringExample:
        fields:
          string: string
      CollectionExample:
        fields:
          strings: list<string>
          map: map<string, StringExample>
          set: set<string>
      OptionalExample:
        alias: optional<string>
        safety: safe
      OptionalCollectionExample:
        alias: optional<map<string, any>>
      EnumExample:
        values:
          - A
          - B
    errors:
      InvalidTypeDefinition:
        namespace: Conjure
        code: INVALID_ARGUMENT
        docs: Invalid Conjure type definition.
        safe-args:
          typeName: string
        unsafe-args:
          typeDef: any
      InvalidServiceDefinition:
        namespace: Conjure
        code: INVALID_ARGUMENT
        docs: Invalid Conjure service definition.
        safe-args:
          serviceName:
            type: string
            docs: Name of the invalid service definition.
        unsafe-args:
          serviceDef:
            type: any
            docs: Details of the invalid service definition.
      JavaCompilationFailed:
        namespace: ConjureJava
        docs: Failed to compile Conjure definition to Java code.
        code: INTERNAL
      DifferentPackage:
        package: com.palantir.another
        namespace: Conjure
        docs: Different package.
        code: INTERNAL
      ConflictingCauseSafeArg:
        namespace: Conjure
        docs: Cause argument conflicts with reserved Throwable cause parameter.
        code: INTERNAL
        safe-args:
          cause: string
          shouldThrow: boolean
      ConflictingCauseUnsafeArg:
        namespace: Conjure
        docs: Cause argument conflicts with reserved Throwable cause parameter.
        code: INTERNAL
        unsafe-args:
          cause: string
          shouldThrow: boolean
      ErrorWithComplexArgs:
        namespace: Conjure
        docs: Error with complex arguments.
        code: INTERNAL
        safe-args:
          stringExample: StringExample
          primitive: Long
          collectionExample: CollectionExample
          optionalExample: OptionalExample
          optionalCollectionExample: OptionalCollectionExample
          enumExample: EnumExample
