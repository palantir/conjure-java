apply plugin: 'application'

application {
    mainClass = 'org.openjdk.jmh.Main'
}

versionsLock {
    testProject()
}

dependencies {
    implementation project(':conjure-java-undertow-runtime')
    implementation project(':conjure-undertow-lib')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.google.guava:guava'
    implementation 'com.palantir.conjure.java.api:errors'
    implementation 'com.palantir.conjure.java.runtime:conjure-java-jackson-serialization'
    implementation 'com.palantir.deadlines:deadlines'
    implementation 'com.palantir.safe-logging:logger'
    implementation 'com.palantir.safe-logging:preconditions'
    implementation 'com.palantir.safe-logging:safe-logging'
    implementation 'com.palantir.tracing:tracing'
    implementation 'com.palantir.tracing:tracing-api'
    implementation 'io.undertow:undertow-core'
    implementation 'org.jboss.xnio:xnio-api'
    implementation 'org.jspecify:jspecify'
    implementation 'org.openjdk.jmh:jmh-core'
    implementation 'org.slf4j:slf4j-api'

    // Both handler variants use the same logger, with output disabled during measurement.
    runtimeOnly 'org.slf4j:slf4j-simple'
    annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess'
}

def handlerSource = project(':conjure-java-undertow-runtime').layout.projectDirectory.file(
        'src/main/java/com/palantir/conjure/java/undertow/runtime/ConjureExceptions.java')
def baselineDirectory = layout.buildDirectory.dir('generated/sources/benchmarkBaseline')
def generateBenchmarkBaseline = tasks.register('generateBenchmarkBaseline') {
    inputs.file(handlerSource)
    outputs.dir(baselineDirectory)
    doLast {
        String original = handlerSource.asFile.getText('UTF-8')
        String check = '''        if (isRetriesExhausted(throwable)) {
            exchange.getResponseHeaders().put(RETRIES_EXHAUSTED_HEADER, "true");
        }
'''
        String declaration = 'public enum ConjureExceptions implements ExceptionHandler'
        String scanDeclaration = 'private static boolean isRetriesExhausted(Throwable failure)'
        if (original.indexOf(check) < 0 || original.indexOf(check) != original.lastIndexOf(check)
                || !original.contains(declaration) || !original.contains(scanDeclaration)) {
            throw new GradleException('ConjureExceptions changed: review the benchmark baseline transformation')
        }
        // Copy the current implementation, changing only the entry check and benchmark accessibility.
        // Keep SafeLoggerFactory.get(ConjureExceptions.class) unchanged so both variants use the same logger.
        String baseline = original.replace(check, '')
                .replace(declaration, '@javax.annotation.processing.Generated("generateBenchmarkBaseline")\n'
                        + 'public enum BenchmarkConjureExceptions implements ExceptionHandler')
                .replace(scanDeclaration, 'static boolean isRetriesExhausted(Throwable failure)')
        File output = baselineDirectory.get().file(
                'com/palantir/conjure/java/undertow/runtime/BenchmarkConjureExceptions.java').asFile
        output.parentFile.mkdirs()
        output.setText(baseline, 'UTF-8')
    }
}
sourceSets.main.java.srcDir(generateBenchmarkBaseline)

tasks.named('checkstyleMain') {
    exclude '**/BenchmarkConjureExceptions.java'
}

tasks.withType(JavaCompile).configureEach {
    // JMH initializes @Param and @Setup fields after constructing the state.
    options.errorprone.disable 'NullAway'
}

tasks.register('jmh', JavaExec) {
    group = 'benchmark'
    description = 'Measures retry-exhaustion scanning and exception handling before and after the check.'
    mainClass = 'org.openjdk.jmh.Main'
    classpath = sourceSets.main.runtimeClasspath
    File results = file(providers.gradleProperty('jmhResultFile').getOrElse('build/reports/jmh/results.json'))
    args '-rf', 'json', '-rff', results.absolutePath, '-foe', 'true'
    String options = providers.gradleProperty('jmhOptions').getOrElse('').trim()
    if (!options.isEmpty()) {
        args options.split('\\s+')
    }
    doFirst {
        results.parentFile.mkdirs()
    }
}
